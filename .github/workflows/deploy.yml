name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fencing-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            bash <<'DEPLOY'
            set -Eeuo pipefail

            cd /home/tvr/fencing

            request_file=/tmp/fencing-deploy.requested
            lock_file=/tmp/fencing-deploy.lock

            touch "$request_file"

            exec 9>"$lock_file"
            if ! flock -n 9; then
              echo "Deploy is already running; queued the latest version"
              exit 0
            fi

            while true; do
              rm -f "$request_file"

              echo "Syncing repositories"
              git -C backend fetch --prune origin main
              git -C backend reset --hard origin/main
              git -C frontend fetch --prune origin main
              git -C frontend reset --hard origin/main

              echo "Building images before replacing containers"
              docker compose -p fencing build backend frontend

              echo "Replacing containers after successful build"
              if docker compose up --help | grep -q -- '--wait'; then
                docker compose -p fencing up -d --no-build --remove-orphans --wait
              else
                docker compose -p fencing up -d --no-build --remove-orphans
              fi

              docker compose -p fencing ps

              if [ ! -f "$request_file" ]; then
                sleep 2
              fi

              if [ ! -f "$request_file" ]; then
                break
              fi

              echo "Another deploy request arrived; deploying the latest version"
            done
            DEPLOY
